set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"

# LaunchAgent-started tmux inherits a minimal PATH (no user-tool dirs), which
# breaks 'run' directives whose scripts shell out to `tmux` (catppuccin, tpm)
# AND non-interactive tmux (run-shell, hooks -- where the scheduler lives),
# which never sources .zshrc's PATH recovery. Homebrew only exists on mac;
# OS-detect the same way tmux/start.sh does ($OSTYPE there, uname here since
# tmux.conf is parsed by tmux itself, not a shell that exports $OSTYPE).
if-shell "uname | grep -q Darwin" \
  "set-environment -g PATH \"$HOME/.local/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$HOME/go/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"" \
  "set-environment -g PATH \"$HOME/.local/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$HOME/go/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\""

set -g @continuum-boot "on"
set -g @continuum-restore "on"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-pain-control"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-logging"
set -g @plugin "catppuccin/tmux"

run "$HOME/.tmux/plugins/tmux/catppuccin.tmux"
set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_current_text " #{window_name}"

set -g @catppuccin_flavour "macchiato"
set -g @catppuccin_window_status_style "rounded"

set -g status-left ""
set -g status-right ""

run "$HOME/.tmux/plugins/tpm/tpm"

# ---------------------------------------------------------------------------
# THE HALL (bead dotfiles-sb6s) — the court view as a server-wide popup, and
# the front desk as the attach default.
#
# ⚠️ THIS BLOCK MUST STAY AFTER THE tpm RUN ABOVE — tpm's plugin loads run in
# file order and last writer wins, so a binding placed before it can be silently
# overwritten by a plugin.
#
# THE KEY IS `prefix W` (Zig, 2026-08-09). It was UNBOUND, so the hall displaces
# nothing — `prefix H` (pain-control's resize-pane -L 5) stays as it was. The
# mnemonic is the point: `prefix w` is tmux's own window chooser, and the hall is
# that idea raised to the estate — seats, not raw windows. Shifted sibling of a
# key the muscle memory already has.
#
# WHY A POPUP, NOT A WINDOW (Zig, 2026-08-09): the hall is a thing you glance
# at from wherever you are, never a place you go. `display-popup -E` overlays
# the current pane on any window in any session.
#
# The `read` is load-bearing: -E closes the popup the moment the command exits,
# and the court view is a one-shot render, so without it the hall would flash.
# HALL-BLOCK-BEGIN
bind W display-popup -E -w 84 -h 32 "$HOME/dotfiles/agents/bin/hall; echo; echo '[Enter closes the hall]'; read -r _"

# THE FRONT DESK IS THE DEFAULT (ratified 2026-08-09, sb6s ergonomics comment):
# a fresh session on the keep lands at the seneschal's window, not at whatever
# shell tmux happened to open. Two guards, both deliberate:
#   * `#{==:#{hook_session_name},#{host_short}}` — fires ONLY for the
#     host-named session (one session per server, named for the host: the
#     2026-08-09 topology ruling on dotfiles-demesne-lexicon-gadu). A fixture
#     server, a scratch session, a second host: untouched.
#   * HALL_ONLY_IF_ABSENT=1 — if a seneschal window already exists (this hook
#     also fires when tmux-resurrect/continuum restores a session), do nothing.
#     Never yank a restored session to another window.
# The socket comes from #{socket_path} rather than an inherited $TMUX, so the
# hook can only ever act on the server that fired it.
#
# The shell window tmux creates alongside the session is left alone on purpose
# and shows as 🚧 UNREGISTERED in the court view: the hall never adopts a
# hand-made window silently (sb6s AC2). Adoption is a v1 verb through the roster.
set-hook -g session-created 'if-shell -F "#{==:#{hook_session_name},#{host_short}}" "run-shell -b \"HALL_TMUX_SOCKET=#{socket_path} HALL_SESSION=#{hook_session_name} HALL_ONLY_IF_ABSENT=1 $HOME/dotfiles/agents/bin/hall home\""'
# HALL-BLOCK-END
