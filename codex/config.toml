# Codex CLI config — symlinked from ~/.codex/config.toml (dotfiles-1ctd2 W0).
# Codex writes project trust and model choices back into this file, so keep it
# seeded and tracked. Codex-only guidance goes in developer_instructions here,
# never in the shared AGENTS.md that every Claude seat reads.

# The shared doctrine (~/.agents/agents/AGENTS.md) is ~55 KB; Codex's 32 KiB
# default silently truncates it.
project_doc_max_bytes = 131072

cli_auth_credentials_store = "file"
check_for_update_on_startup = false

# Codex seats run INSIDE the existing bwrap jail, which is the containment; they
# bypass Codex's own sandbox and never prompt (Zig at the desk 2026-09-24,
# dotfiles-zi6x7 / dotfiles-xhedj). This also gives them the same spool-append
# power as a Claude seat.
sandbox_mode = "danger-full-access"
approval_policy = "never"

[projects."/home/ubuntu/demesne"]
trust_level = "trusted"
