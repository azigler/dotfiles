# Vacation Station 14 — reef-router edge proxy
#
# reef-router moved to pico in Phase 3 follow-up (dotfiles-mh9). zig-computer
# keeps :7575 as the public endpoint (granola webhook URL doesn't change);
# nginx forwards everything to pico's reef-router over tailnet.

server {
    listen 7575;
    listen [::]:7575;
    server_name _;

    client_max_body_size 16m;

    # SECURITY (2026-07-26): the granola read API + UI served confidential
    # meeting transcripts to ANONYMOUS requests (GET /coral/granola/api/... and
    # /coral/granola/ui both returned 200 over TLS *and* cleartext :7575).
    # Today's token auth was scoped to the webhook ROUTE only, while nginx
    # proxied location / wholesale. Every other coral adapter is dead or a
    # zombie stub, so the ONLY legitimate traffic is Zapier POSTing the webhook.
    # Allow exactly that; everything else is refused at the edge.
    location = /coral/granola/webhook {
        proxy_pass http://pico.tailfb4637.ts.net:7575;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
