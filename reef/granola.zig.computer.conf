# granola.zig.computer — TLS edge for the reef-router coral webhooks
#
# WHY: the Zapier -> reef leg ran over plain HTTP on
# http://51.81.33.136:7575/coral/granola/webhook, so confidential meeting
# transcripts crossed the public internet in cleartext (bead dotfiles-ks1u).
# This vhost terminates TLS on zig-computer and forwards to the SAME upstream
# the :7575 vhost uses — reef-router on pico, over the tailnet.
#
# The :7575 listener (/etc/nginx/sites-available/reef-router-7575.conf) stays
# up deliberately: Zapier keeps posting there until Zig edits the Zap URL by
# hand. Both paths must work simultaneously; do not close :7575 first.
#
# Upstream is a hostname, not an IP, so nginx resolves it at config load —
# `nginx -t` fails loudly if the tailnet name stops resolving.
#
# Install (see the /nginx skill):
#   sudo install -m 0644 reef/granola.zig.computer.conf \
#       /etc/nginx/sites-available/granola.zig.computer.conf
#   sudo ln -sf /etc/nginx/sites-available/granola.zig.computer.conf \
#       /etc/nginx/sites-enabled/granola.zig.computer.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d granola.zig.computer   # adds 443 + the 80 redirect
#
# This repo file stays HTTP-only; certbot owns the 443/redirect stanzas on the
# LIVE file. Do NOT `sudo install` over a certbot-shaped live config — use the
# surgical-edit pattern from the /nginx skill.

server {
    listen 80;
    listen [::]:80;
    server_name granola.zig.computer;

    # Matches reef-router-7575.conf. Granola payloads are tens of KB, but a
    # long meeting's transcript can be much larger, and a silently truncated
    # meeting is worse than a rejected one.
    client_max_body_size 16m;

    location / {
        proxy_pass http://pico.tailfb4637.ts.net:7575;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
