# seats.yml — the single roster (dotfiles-seat-address-spec-uikg schema v1).
#
# A SEAT is a durable, named agent identity above session and sandbox (Yegge's
# Gas Town: "sessions are days, seats are people"). A TAP is a token/quota
# source a seat draws from at inject time. Full spec: bead
# dotfiles-seat-address-spec-uikg. Ratified roster + offices/sigils:
# dotfiles-seat-roster-from-windows-ojjf. Tap-type abstraction: dotfiles-d3ky.
#
# Read by (once each lands): seat_resolve (btti), pulse-inject (d0bk), harnessd
# fleet join (harnessd-g7qd), seneschal, laurels. Enumerable with NO tmux
# server running (R8) — this file is complete on its own.
#
# Ephemeral worktree subagents are explicitly NOT seats and never get a row
# here (ojjf). Game daemons (vs14d/ts4d/robloxd/creaturesd) are deliberately
# UNSEATED for now — Article IV's steward process creates a seat on demand
# when a seating trigger fires (schedule attaches / continuity matters /
# something needs to address it / a charter claims stewardship) — see
# dotfiles-th3e.

schema: 1

hosts: [zig-computer] # future: pico, metis

# Reserved for the charter REGISTRY (epic dotfiles-ixap, spec dotfiles-ohnq) —
# a named grouping of seats (e.g. "Inquiry" vs "Household"), distinct from
# each seat's own one-line `charter-line:`. Null until that registry ships;
# the validator accepts the key now so it never has to reject it later.
charter: null

# ---------------------------------------------------------------------------
# TAPS — token/quota sources. `type:` is REQUIRED (dotfiles-d3ky): claude|codex
# today; unknown values are rejected. `launch:`/`preflight:`/`identity:` are
# optional schema-forward keys (per-type strategy overrides) — absent means
# "use the type's default", nothing consumes them yet.
#
# FAILOVER IS ASYMMETRIC, DELIBERATELY (Zig 2026-08-08): personal seats fail
# over to work when personal is exhausted/unavailable, but work-tap seats do
# NOT fail over to personal — a schedule bound to `work` (LinearB's day-of-week
# + reporting rows) is Zig's job, and silently spending the wrong account's
# quota on someone else's work is worse than the row stalling. `tick` mirrors
# tick-jailed.sh's own AUTO-DETECT-WITH-SAFE-FALLBACK (explore-24fn): if the
# isolated ~/.claude-tick credential is missing, the jail already falls back to
# the shared/personal config, so the same order is recorded here.
# ---------------------------------------------------------------------------
taps:
  personal:
    type: claude
    config_dir: ~/.claude
    failover: [work]
  work:
    type: claude
    config_dir: ~/.claude-work
    failover: [] # NEVER falls over to personal — see note above
  tick:
    type: claude
    config_dir: ~/.claude-tick
    failover: [personal] # matches tick-jailed.sh's own isolated->shared fallback

# ---------------------------------------------------------------------------
# SEATS — the offices of the estate. `model:` policy (dotfiles-pulse-row-model-
# seat-d0bk, Zig 2026-08-08): DEFAULT-UP, PIN-DOWN. Judgment-charter seats
# either pin `fable` explicitly or, where not yet explicitly assigned, inherit
# the machine default (also `fable` today) — a missing pin over-spends, never
# under-thinks. Mechanical-charter seats pin `sonnet`. `dive` and
# `autonoveld` (creative generation) pin `opus`. AMENDMENT (Zig 2026-08-09):
# `linearb` pins `fable` for ALL seven of its schedules — "high impact work",
# no sonnet-default carve-out.
#
# `home:` is the default cwd — seats ROAM, home is not a jail. `history:` is
# append-only, machine-level under refs/seats/ (OQ1 resolution on uikg,
# 2026-08-08), distinct from the per-window handoff note that gets
# overwritten every session. `aliases:` are prior/alternate window names that
# resolve to this seat (rename migration AND, for the linearb merge, the
# still-live per-day/per-report window names that never got literally renamed
# to "linearb").
# ---------------------------------------------------------------------------
seats:

