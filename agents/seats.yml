    # watchtower's own tool, an object like every other sigil in this roster
    # (💂 was the runner-up and is the fallback if Zig wants a guard, not a
    # glass).
    sigil: "🔭"
    home: ~/harnessd
    model: fable
    effort: high
    tap: personal
    aliases: []
    history: refs/seats/harnessd.history.md
    # A live systemd daemon (harnessd.service), not a pulse-tick loop — so no
    # SCHEDULE binding to record. The seat's own `tap:` above still applies:
    # it is what a hall visit launches this seat on.
    schedules: []

