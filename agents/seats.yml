    model: fable
    effort: high
    aliases: []
    history: refs/seats/seneschal.history.md
    # v0 design (dotfiles-front-desk-faty) is a daily pulse-seneschal timer,
    # not yet shipped — no unit exists in `systemctl --user list-unit-files`
    # as of 2026-08-09. Reserved seat, interactive/no-schedule until then.
    schedules: []

  marshal:
