# seats.yml — the single roster (dotfiles-seat-address-spec-uikg schema v1).
#
# A SEAT is a durable, named agent identity above session and sandbox (Yegge's
# Gas Town: "sessions are days, seats are people"). A TAP is a token/quota
# source a seat draws from at inject time. Full spec: bead
# dotfiles-seat-address-spec-uikg. Ratified roster + offices/sigils:
# dotfiles-seat-roster-from-windows-ojjf. Tap-type abstraction: dotfiles-d3ky.
#
# Read by (once each lands): seat_resolve (btti), pulse-inject (d0bk), harnessd
# fleet join (harnessd-g7qd), seneschal, laurels. Enumerable with NO tmux
# server running (R8) — this file is complete on its own.
#
# Ephemeral worktree subagents are explicitly NOT seats and never get a row
# here (ojjf). Game daemons (vs14d/ts4d/robloxd/creaturesd) are deliberately
# UNSEATED for now — Article IV's steward process creates a seat on demand
# when a seating trigger fires (schedule attaches / continuity matters /
# something needs to address it / a charter claims stewardship) — see
# dotfiles-th3e.

schema: 1

hosts: [zig-computer] # future: pico, metis

# Reserved for the charter REGISTRY (epic dotfiles-ixap, spec dotfiles-ohnq) —
# a named grouping of seats (e.g. "Inquiry" vs "Household"), distinct from
# each seat's own one-line `charter-line:`. Null until that registry ships;
# the validator accepts the key now so it never has to reject it later.
charter: null

# ---------------------------------------------------------------------------
# TAPS — token/quota sources. `type:` is REQUIRED (dotfiles-d3ky): claude|codex
# today; unknown values are rejected. `launch:`/`preflight:`/`identity:` are
# optional schema-forward keys (per-type strategy overrides) — absent means
# "use the type's default", nothing consumes them yet.
#
# FAILOVER IS ASYMMETRIC, DELIBERATELY (Zig 2026-08-08): personal seats fail
# over to work when personal is exhausted/unavailable, but work-tap seats do
# NOT fail over to personal — a schedule bound to `work` (LinearB's day-of-week
# + reporting rows) is Zig's job, and silently spending the wrong account's
# quota on someone else's work is worse than the row stalling.
# ---------------------------------------------------------------------------
taps:
  personal:
    type: claude
    config_dir: ~/.claude
    failover: [work]
  work:
    type: claude
    config_dir: ~/.claude-work
    failover: [] # NEVER falls over to personal — see note above

# ---------------------------------------------------------------------------
# PROFILES (dotfiles-iez1) — a jail/config-dir VARIANT of a real tap, not a
# billing source of its own. Verified empirically 2026-08-09: ~/.claude and
# ~/.claude-tick carry IDENTICAL account fingerprints (same Max subscription;
# only ~/.claude-work is a distinct account), so 'tick' was never a second tap
# — it is the isolated bwrap sandbox tick-jailed.sh (explore-24fn) runs the
# dive/digest pulse in, still spending the `personal` tap's quota. A seat's
# BILLING is always its `tap:`; `profile:` only names which config-dir variant
# a launch actually used. tick-jailed.sh's own AUTO-DETECT-WITH-SAFE-FALLBACK
# already falls the isolated ~/.claude-tick credential back to the shared
# ~/.claude one when missing — both ends of that fallback are the SAME tap, so
# there is no failover list here the way `taps:` has one.
# ---------------------------------------------------------------------------
profiles:
  tick:
    config_dir: ~/.claude-tick
    tap: personal
    jail: bwrap

# ---------------------------------------------------------------------------
# UNIT ALLOWLIST (dotfiles-hfm5) — enabled pulse-* timers that are
# deliberately NOT a seat schedule row: fleet-infra plumbing, not a JOB or
# OFFICE (Article IV seats jobs, not timers). pulse-retry sweeps the ledger's
# retry queue; pulse-stall detects a stalled tick. Both fire fleet-wide and
# answer to no single seat. Anything else enabled and unclaimed is a real
# UNIT-ORPHAN finding, not a candidate for this list by default.
# ---------------------------------------------------------------------------
unit_allowlist: [pulse-retry, pulse-stall]

# ---------------------------------------------------------------------------
# SEATS — the offices of the estate. `model:` policy (dotfiles-pulse-row-model-
# seat-d0bk, Zig 2026-08-08): DEFAULT-UP, PIN-DOWN. Judgment-charter seats
# either pin `fable` explicitly or, where not yet explicitly assigned, inherit
# the machine default (also `fable` today) — a missing pin over-spends, never
# under-thinks. Mechanical-charter seats pin `sonnet`. `dive` and
# `autonoveld` (creative generation) pin `opus`. AMENDMENT (Zig 2026-08-09):
# `linearb` pins `fable` for ALL seven of its schedules — "high impact work",
# no sonnet-default carve-out.
#
# `sigil:` must be Emoji_Presentation=Yes — the PROPERTY, enforced against
# embedded Unicode data by validate-seats.py (dotfiles-gl6z). A text-default
# glyph inside the emoji blocks (🗝 🛡 🕯 🕊 were all four) measures ONE cell
# and stilts its row in the hall's court view. Do not pick a sigil by eye.
#
# `tap:` is REQUIRED on every seat (Zig, 2026-08-09): the tap this seat draws
# from when something launches it — its schedules' tap where it has schedules,
# and `personal` where it has none, because personal IS the default and the
# roster STATES its defaults rather than leaving a reader (or a court view) to
# render `-`. A schedule's own `tap:` still governs that schedule; this is the
# seat's, and it is what the hall shows and what a launch exports.
#
# `home:` is the default cwd — seats ROAM, home is not a jail. `history:` is
# append-only, machine-level under refs/seats/ (OQ1 resolution on uikg,
# 2026-08-08), distinct from the per-window handoff note that gets
# overwritten every session. `aliases:` are prior/alternate window names that
# resolve to this seat (rename migration AND, for the linearb merge, the
# still-live per-day/per-report window names that never got literally renamed
# to "linearb").
# ---------------------------------------------------------------------------
seats:

  # --- Household: dispatch, brief, harness --------------------------------

  seneschal:
    charter-line: "ingress/brief — answers 'what needs Zig, everywhere'; no dispatch authority"
    office: "The Seneschal"
    # 🗝 U+1F5DD -> 🔑 U+1F511 (dotfiles-gl6z): the old key is
    # Emoji_Presentation=No, so the front desk's row rendered one cell short.
    # Same object, same office; this one is a real emoji glyph.
    sigil: "🔑"
    home: ~/dotfiles
    model: fable
    effort: high
    tap: personal
    aliases: []
    history: refs/seats/seneschal.history.md
    # SHIPPED (dotfiles-son4, 2026-08-09): pulse-seneschal.timer is installed
    # and ENABLED — `systemctl --user list-timers pulse-seneschal*` shows a next
    # fire. The row claimed "no unit exists" for as long as the unit did exist,
    # which is the roster lying about the one fact it is the source of truth
    # for. Fields transcribed from the unit's own ExecStart (--dir %h/dotfiles
    # --session zig-computer --window seneschal --fresh --cmd "/seneschal
    # brief"); no --config-dir there, so the tap is the default personal one.
    schedules:
      - unit: pulse-seneschal
        tap: personal
        window: seneschal
        session: zig-computer

  marshal:
    charter-line: "fleet dispatch authority — the worker-facing half of Yegge's Wheelhouse"
    office: "The Marshal"
    sigil: "🪖"
    home: ~/dotfiles
    model: fable
    effort: high
    tap: personal
    aliases: []
    history: refs/seats/marshal.history.md
    # SHIPPED, PENDING THE MAIDEN RUN (dotfiles-69qr, 2026-08-09). The drain
    # itself is built — agents/scheduler/marshal-drain.sh (budget/plan/record/
    # verify), agents/scheduler/marshal.conf (the knobs), and the /marshal
    # skill — and pulse-marshal.{service,timer} exist as TEMPLATES under
    # agents/scheduler/templates/ (nightly 01:07 PT, --fresh, no --model so
    # this row's `fable` pin is what resolves).
    #
    # ⚠️ The unit is NOT installed and NOT enabled: Zig's OQ1 resolution makes
    # the maiden night SUPERVISED and hand-launched after the demesne cutover
    # (the launch line is in the .service template's header). The row is
    # recorded anyway, per picod's and autonoveld's convention — the roster's
    # job is to say what schedule this seat HAS, and a row that appears only
    # after install is a roster that learns about its own seats last (son4).
    #
    # This does mean validate-seats.py's UNIT rule reports one finding until
    # the install: "schedule names unit 'pulse-marshal', which has no installed
    # pulse-marshal.timer". That is WARN-by-default and NOT allowlisted — the
    # unit_allowlist above is the OTHER direction (an enabled timer no seat
    # claims), and using it here would be lying about the state to silence a
    # warning that is telling the truth. It clears when the timer is installed.
    # Check with: systemctl --user list-timers 'pulse-marshal*' --all
    schedules:
      - unit: pulse-marshal
        tap: personal
        window: marshal
        session: zig-computer

  dotfiles:
    charter-line: "harness orchestrator — owns the always-loaded instruction tier"
    office: "The Master of Works"
    sigil: "🧰"
    # Post-cutover this moves to ~/demesne (dotfiles-th3e); pre-cutover it is
    # the repo whose worktree this file lives in.
    home: ~/dotfiles
    model: fable
    effort: high
    tap: personal
    aliases: []
    history: refs/seats/dotfiles.history.md
    # Interactive window (zig-computer:dotfiles), no pulse timer.
    schedules: []

  harnessd:
    charter-line: "watchtower — harness observability daemon, PWA + action API"
    office: "The Warden"
    # 🛡 U+1F6E1 -> 🔭 U+1F52D (dotfiles-gl6z). The shield is
    # Emoji_Presentation=No and every EPres=Yes shield-like glyph is either a
    # person (💂) or an alarm (🚨). The charter-line is "watchtower — harness
