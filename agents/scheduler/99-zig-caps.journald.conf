# Installed to /etc/systemd/journald.conf.d/99-zig-caps.conf by ubuntu.setup.sh.
# Drop-in rather than editing /etc/systemd/journald.conf directly so apt
# upgrades of systemd don't clobber these settings.
#
# dotfiles-9h8n (2026-08-09): the fleet's fail-closed checkers (vs14d-backup-health,
# picod-health, ...) write their PASS/FAIL verdict to `journalctl --user -u <unit>`
# and nothing else — no separate ledger. A prior live-only version of this drop-in
# (SystemMaxUse=1G, MaxRetentionSec=30day) was already MORE generous than the values
# below and a checker's verdict still rotated out of `journalctl --user` after only
# ~6 hours — so raising these numbers is necessary but may not be sufficient; if a
# verdict still disappears within MaxRetentionSec after this lands, the actual
# governor is something other than these two knobs (see bead notes) and the
# durable-ledger alternative in dotfiles-9h8n's acceptance criteria is the fallback.
[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=14day
