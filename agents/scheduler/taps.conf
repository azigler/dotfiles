# taps.conf — the TAP POOLS, their preference ORDER, and the per-seat home-tap
# overrides (dotfiles-kecb, building dotfiles-rbci's ruled spec).
#
# Read by agents/lib/tap-headroom.sh; nothing else parses it. Same posture as
# marshal.conf and escalate.conf: strict `key=value`, one per line, `#`
# comments, NO expansion and NO command substitution — the parser matches a
# grammar and REFUSES anything else, because this file is consulted on the
# LAUNCH PATH of every `claude` on the box and a conf that can execute is a
# conf that can be an incident.
#
# ---------------------------------------------------------------------------
# THE POOL IS THE HEADROOM UNIT, NOT THE TAP (Zig's ruling, 2026-08-09)
# ---------------------------------------------------------------------------
# Rate limits are per ACCOUNT. ~/.claude and ~/.claude-tick are two GRANTS of
# the SAME account (andrewzigler@gmail.com — verified from both config files),
# so failing over from `primary` to `tick` moves nothing: they share one
# ceiling. Three pools, therefore, not four taps:
#
#   pool primary    = tap primary (~/.claude) + profile tick (~/.claude-tick)
#   pool secondary  = tap secondary (~/.claude-secondary, zig@zigler.ai)
#   pool linearb    = tap linearb (~/.claude-work, andrew.zigler@linearb.io)
#
# ---------------------------------------------------------------------------
# EPOCH 3 — THE TAP NAMES CHANGED, THE ACCOUNTS DID NOT (2026-08-09)
# ---------------------------------------------------------------------------
# `personal` -> `primary` and `work` -> `linearb`, Zig's naming ruling of
# 2026-08-09 ~19:1xZ. agents/seats.yml still carries the EPOCH-2 names in its
# `taps:` block and in every seat's `tap:` value, and several consumers read
# those strings (marshal.conf's tap filter, pulse-inject's seat pinning), so
# the roster rename is a separate, sequenced change — see the bead filed
# alongside this file. `groups=` below is what makes both epochs queryable at
# once: it lists every VALUE that has ever identified this pool in the
# gateway's `agentgateway_group` column, and classification is BY VALUE, never
# by date (the cutover is rolling — a durable pane emits the old value until
# its days-old shell is replaced).

# --- THE PREFERENCE ORDER -------------------------------------------------
# Zig, 2026-08-09: primary > secondary > linearb. Applied to any launch whose
# seat carries no `seat_home.<seat>` override below. A rollover is PER LAUNCH,
# never a rebind: the home tap is tried first every single time.
order=primary,secondary,linearb

# --- THE POOLS ------------------------------------------------------------
# taps        the tap/profile names that draw on this pool's ceiling
# config_dir  the CLAUDE_CONFIG_DIR a launch rolled over into this pool uses,
#             and the credential the OAuth usage arm reads for it
# groups      every agentgateway_group value that identifies this pool, across
#             attribution epochs (epoch 3 name first, epoch 2 name after)
pool.primary.taps=primary,tick
pool.primary.config_dir=~/.claude
pool.primary.groups=primary,personal

pool.secondary.taps=secondary
pool.secondary.config_dir=~/.claude-secondary
pool.secondary.groups=secondary

pool.linearb.taps=linearb
pool.linearb.config_dir=~/.claude-work
pool.linearb.groups=linearb,work

# --- PER-SEAT HOME-TAP OVERRIDES ------------------------------------------
# `seat_home.<seat>=<pool>` — a seat whose HOME pool is not the global first
# choice. LinearB-based seats keep linearb as home (Zig, 2026-08-09): their
# work belongs on LinearB's subscription and must not silently start on
# Zig's. The override moves the seat's FIRST choice only; the rest of the
# order still applies behind it, so a linearb seat at its ceiling rolls
# linearb > primary > secondary.
seat_home.linearb=linearb
# Zig, 2026-08-09 ~21:20Z — SUPERSEDES spec OQ5 "marshal rides personal"
# (recorded ruling, changed by him via AskUserQuestion in the consul session):
# the marshal drains overnight on the FRESH pool so the derived budget funds
# big while primary sits near its weekly ceiling (0.83/0.77 at ruling time).
# First choice only; the order rule still applies behind it.
seat_home.marshal=secondary

# --- THE CEILING ----------------------------------------------------------
# CEILING ONLY — no proactive spreading (Zig, OQ-2, 2026-08-09). A pool is
# unavailable when an observed utilization reaches this fraction of its
# window, on EITHER the 5h or the 7d window (OQ-5: BOTH windows count), or
# when the model-scoped weekly allotment below is exhausted for a launch that
# names that model.
#
# 1.0 means "no proactive switch at all". Do not lower it to spread load: that
# is the decision Zig ruled against, and lowering it here silently reverses
# him for the whole fleet.
ceiling=1.0

# --- THE MODEL-SCOPED WEEKLY ALLOTMENT (the FABLE dimension) --------------
# Discovered 2026-08-09 (dotfiles-kecb): the account's own usage document
# carries a `limits[]` entry with kind=weekly_scoped and
# scope.model.display_name — for Fable it read 81% while the unified weekly
# read 75%. That dimension does NOT exist in the gateway's captured
# attributes (only anthropic.ratelimit.{5h,7d}), so it is readable ONLY from
# the per-account usage document. `fable_models` is the substring set that
# makes a launch's --model count as a Fable launch.
fable_scope=Fable
fable_models=fable
# 0.97, not 1.0 (Zig's directive, 2026-08-10 ~01:0xZ, at 97% primary Fable):
# a Fable-named launch should roll BEFORE the allotment is fully burned, not
# after its first 429 — at 1.0 the seat only moves once requests are already
# failing. This is the model-scoped knob, not the unified `ceiling` above;
# the no-proactive-spreading ruling there stands untouched. Left permanently:
# post-reset the reading drops below 0.97 and seats come home on their own.
fable_ceiling=0.97

# --- FRESHNESS ------------------------------------------------------------
# cache_ttl_seconds: how long a pool's headroom reading may be reused. The
# consult runs on every claude launch, so this is what keeps it off the
# network; a rollover is ceiling-only, and a ceiling does not appear and
# vanish inside two minutes.
cache_ttl_seconds=120

# timeout_seconds: hard bound on ONE headroom read. Exceeding it is
# `unavailable`, which NEVER rolls over — a slow network must not be able to
# move Zig's billing.
timeout_seconds=4
