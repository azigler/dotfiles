# escalate.conf — which scheduled seats the ladder watches, and its clocks
# (dotfiles-9z3o). Read by pulse-escalate.sh; nothing else parses it.
#
# Format: `key=value`, one per line, `#` comments, no expansion, no command
# substitution — the parser matches a strict grammar and REFUSES anything else
# (marshal.conf's rule: a config file that can execute is a config file that can
# be an incident, and this one is read by an unattended 5-minute loop).
#
# ⚠️ `loops` IS THE OPT-IN GATE FOR RUNGS 2-4, deliberately. A seat that is not
# listed here is never NUDGED, RAISED, BEADED or PUSHED, however hard it bounces.
# That ladder ends in a P1 bead and a buzz on Zig's phone, so seats opt IN to it;
# nothing is inferred from the roster. The marshal is first because it is the
# seat with no human in the room.
#
# ⚠️ RUNG 1 IS NOT GATED, equally deliberately (dotfiles-t5fj). A bouncing loop
# that is NOT listed here still gets the truth-reconciler: capture the pane, and
# strip a lying 🔔/🧠/🌀 only when a joined capture proves chrome absent, no live
# turn, and an idle composer present. That verb summons nobody and re-fires
# nothing, and the seats that stall silently are exactly the ones nobody listed —
# a stale 🧠 makes pulse-inject defer every tick for up to 24h with no watcher.
# The result line reports the two separately (`reconciled:` vs
# `reconciled-unlisted:`), so opting a seat in is still visible in the telemetry.

# --- THE WATCHED SEATS ----------------------------------------------------
# Comma-separated, one entry per critical loop: `<unit-prefix>:<window>:<session>`.
# The unit prefix is what `systemctl --user start <prefix>.service` takes and what
# pulse-inject records as the bounce `loop`; the window/session are the seat's own
# (agents/seats.yml), which is what gets capture-pane'd and, when a stale 🔔 is
# proven, renamed.
loops=pulse-marshal:marshal:zig-computer

# --- THE CLOCKS -----------------------------------------------------------
# grace_minutes: rung 0. How long after the EPISODE'S FIRST BOUNCE a supervising
# session gets to move before this watcher touches anything. Standing still IS
# the rung.
grace_minutes=10

# cooldown_minutes: minimum spacing between two rungs of the same episode. The
# ladder never fires twice in one run and never twice inside this window.
cooldown_minutes=15

# episode_gap_minutes: two bounces further apart than this are DIFFERENT
# episodes, and a newest bounce older than this means the episode is over (the
# loop recovered) — so nothing escalates for it.
episode_gap_minutes=45

# --- THE FRONT DESK (rungs 2 and 3) ---------------------------------------
seneschal_unit=pulse-seneschal
seneschal_window=seneschal
seneschal_session=zig-computer
seneschal_dir=/home/ubuntu/dotfiles

# --- THE UNGATED RUNG (rung 1, every bouncing loop) -----------------------
# reconcile_session: the tmux session an UNLISTED loop's seat window is looked
# for in. Its window name is DERIVED (`pulse-<seat>` -> `<seat>`, with the bare
# unit name as a fallback), because an unlisted loop has no row to read; a wrong
# derivation matches no window and does nothing. This is a separate key from
# seneschal_session on purpose — moving the front desk must not silently move the
# fleet-wide sweep. Omit it and it defaults to seneschal_session.
reconcile_session=zig-computer

# --- THE FLOOR (rung 4) ---------------------------------------------------
# Where the P1 `human:` bead is filed. The `human:` title prefix is not
# decoration — seneschal-gather.py filters on exactly that string, so this is
# the rung that is guaranteed to surface.
bead_repo=/home/ubuntu/dotfiles

# harnessd's Web Push edge. VERIFIED shell-callable from zig-computer on
# 2026-08-09 (see pulse-escalate.sh's header for the three probe responses):
# POST /act/push/test behind actionGate = `X-Harnessd-Action: 1` + an allowlisted
# Origin + a Tailscale whois of the peer, all of which a local curl satisfies.
# Leave push_url EMPTY to make the floor bead-only.
push_url=http://100.98.174.21:14174/act/push/test
push_origin=http://100.98.174.21:14174

# NOT CONFIG KEYS: the three pane-fingerprint EREs. They contain `|`, spaces and a
# `\`, which this grammar rejects on purpose — they are env knobs defaulted in
# pulse-escalate.sh:
#   PULSE_ESCALATE_MODAL_MARKER  dialog chrome  (signal 1 — "genuinely blocked")
#   PULSE_ESCALATE_IDLE_MARKER   composer footer (signal 2 — the POSITIVE evidence
#                                a rename requires; pulse-inject's READY_MARKER)
#   PULSE_ESCALATE_BUSY_MARKER   the interrupt hint (signal 3 — "a turn is RUNNING
#                                right now", which is what keeps a live 🧠 turn
#                                from having its glyph stripped)
# Emptying MODAL or IDLE disables renaming, never blocking: with a signal missing
# the pane is AMBIGUOUS and the ladder escalates. That is the safe direction, and
# it is why a Claude Code UI change costs a false escalation rather than a
# mis-answered dialog. BUSY is the exception and the one to leave alone: emptying
# it REMOVES a refusal instead of adding one.
