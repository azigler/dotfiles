# marshal.conf — the fleet drain's tunable knobs (dotfiles-69qr).
#
# THIS FILE IS DATA, and it is the ONLY place the drain's policy numbers live.
# marshal-drain.sh sources it; nothing else parses it. Per 69qr's 05:11
# amendment the drain has no bead-count cap — the knobs are the BUDGET's
# knobs, and Zig changes them by ruling, not the marshal at 3am.
#
# Format: `key=value`, one per line, `#` comments, no expansion, no command
# substitution (the parser reads key=value pairs and refuses anything else —
# a config file that can execute is a config file that can be an incident).
#
# ⚠️ The pre-commit gate maps this file to agents/scheduler/test-marshal-drain.sh
# (same posture as pico-ports.manifest / demesne-sync.exclude): a hand-edit here
# changes what an unattended loop spends overnight, so it is gated, not trusted.

# --- REPOS ----------------------------------------------------------------
# The opt-in list (R1d). ONE entry per line-item, `name:path`, comma-separated.
# harnessd is opt-in repo #1 by Zig's endgame directive (the maiden campaign,
# ~/harnessd/refs/campaign-2026-08.md); dotfiles joins as marked.
# NOT an inference: a repo absent from this list is not drainable however many
# beads in it carry the marker.
repos=harnessd:/home/ubuntu/harnessd,dotfiles:/home/ubuntu/dotfiles

# The marshal's HOME repo — the one whose worktrees it owns outright, so
# several builders may swarm it at once (Land-Rush). Every OTHER repo in
# `repos` is FOREIGN and gets one writer at a time (R2, and AGENTS.md's
# cross-repo dispatch rule: the isolation hook cannot see a foreign-repo
# write and will pass the dispatch).
home_repo=dotfiles

# --- THE WEEKLY WINDOW ----------------------------------------------------
# The tap's weekly quota window. dow: 0=Sunday .. 6=Saturday; hour is LOCAL
# (see tz_offset_hours). Anthropic's weekly caps reset on a fixed weekday/hour
# per account — set these to the tap's actual reset, not to a guess.
week_reset_dow=3
week_reset_hour=0

# Local-time offset from UTC, in hours, for the estate's wall clock (PT).
# zig-computer's own TZ is UTC (measured 2026-08-09: `date +%z` -> +0000), so
# "PT" has to be stated, not inherited. ⚠️ DST: -7 is PDT; set -8 for PST.
tz_offset_hours=-7

# --- THE TAP --------------------------------------------------------------
# Which tap the marshal rides (OQ5: PERSONAL, Zig 2026-08-09). The budget is
# computed against THIS tap's spend only.
tap=personal

# The weekly cap, in TOKENS. ⚠️ DELIBERATELY EMPTY. The vendor publishes no
# token-denominated weekly cap, and inventing one would make every budget a
# fabrication wearing a number's clothes. Until dotfiles-4icj's header capture
# lands (`anthropic-ratelimit-unified-*`), this stays empty and every `budget`
# run degrades HONESTLY to budget_floor_tokens below, saying why.
# Set it — from the captured headers, or from Zig's explicit ruling — and the
# full derivation switches on with no other change. `--weekly-cap N` overrides
# it for one run (that is how the derivation was exercised pre-capture).
weekly_cap_tokens=

# --- ZIG'S RESERVE + THE MARGIN -------------------------------------------
# zig_daytime_reserve is MEASURED, not configured: the trailing-N-day average
# of this tap's DAYTIME spend, read from the same requests.db. These two set
# what "daytime" means, in local hours (start inclusive, end exclusive).
zig_daytime_start_hour=8
zig_daytime_end_hour=22
zig_reserve_trailing_days=7

# Safety margin, percent, taken off the top after the reserve (R2 amendment).
# One of the two knobs the trust model leaves tunable (the other is the
# reserve's daytime window above).
safety_margin_pct=20

# The DEGRADED floor, in tokens: what the night is allowed to spend when the
# budget could not be computed at all (pico unreachable, db unreadable, cap
# unset). Small on purpose — a degraded night should land one or two beads,
# not run blind. NEVER a fallback to "unlimited".
budget_floor_tokens=150000

# --- THE NIGHT ------------------------------------------------------------
# The window, local hours. The drain stops dispatching at window_end_hour and
# then WAITS for in-flight builders (R5 — never abandon a live agent).
window_start_hour=1
window_end_hour=6

# R6: consecutive failures across DIFFERENT beads that end the night.
max_consecutive_failures=3

# Default dispatch model when a bead carries no `Fleet-Model:` marker (R2).
default_model=sonnet

# --- HOSTS / PATHS --------------------------------------------------------
# Where requests.db lives (the WORKS — pico). Read-only, always.
pico_host=pico
requests_db=~/.local/share/agentgateway/requests.db
